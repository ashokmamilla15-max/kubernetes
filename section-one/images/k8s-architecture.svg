<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%" style="background-color: #0f172a; border-radius: 12px; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="grad-master" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="grad-worker" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Title -->
  <text x="400" y="32" fill="#38bdf8" font-size="18" font-weight="700" text-anchor="middle">Kubernetes Cluster Architecture (Control Plane vs Worker Node)</text>

  <!-- Master Node (Control Plane) Container -->
  <rect x="30" y="60" width="350" height="270" rx="12" fill="url(#grad-master)" stroke="#6366f1" stroke-width="2" filter="url(#shadow)" />
  <rect x="45" y="72" width="320" height="30" rx="6" fill="#4338ca" />
  <text x="205" y="92" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">👑 Control Plane (Master Node)</text>

  <!-- Control Plane Components -->
  <rect x="50" y="115" width="145" height="45" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
  <text x="122" y="142" fill="#e0e7ff" font-size="13" font-weight="600" text-anchor="middle">kube-apiserver</text>

  <rect x="210" y="115" width="145" height="45" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
  <text x="282" y="142" fill="#e0e7ff" font-size="13" font-weight="600" text-anchor="middle">etcd (Datastore)</text>

  <rect x="50" y="175" width="145" height="45" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
  <text x="122" y="202" fill="#e0e7ff" font-size="13" font-weight="600" text-anchor="middle">kube-scheduler</text>

  <rect x="210" y="175" width="145" height="45" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
  <text x="282" y="202" fill="#e0e7ff" font-size="12" font-weight="600" text-anchor="middle">controller-mgr</text>

  <rect x="50" y="235" width="305" height="75" rx="8" fill="#111827" stroke="#4f46e5" stroke-dasharray="4 4" />
  <text x="202" y="258" fill="#a5b4fc" font-size="12" font-weight="600" text-anchor="middle">Control Plane Function</text>
  <text x="202" y="278" fill="#94a3b8" font-size="11" text-anchor="middle">Makes global scheduling decisions, monitors cluster</text>
  <text x="202" y="294" fill="#94a3b8" font-size="11" text-anchor="middle">health, &amp; manages cluster state via API.</text>

  <!-- Arrow between Master and Worker -->
  <path d="M 380 180 L 415 180" stroke="#38bdf8" stroke-width="3" />
  <polygon points="413,174 423,180 413,186" fill="#38bdf8" />

  <!-- Worker Node Container -->
  <rect x="420" y="60" width="350" height="270" rx="12" fill="url(#grad-worker)" stroke="#10b981" stroke-width="2" filter="url(#shadow)" />
  <rect x="435" y="72" width="320" height="30" rx="6" fill="#047857" />
  <text x="595" y="92" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">⚙️ Worker Node Infrastructure</text>

  <!-- Worker Node Components -->
  <rect x="440" y="115" width="145" height="45" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1.5" />
  <text x="512" y="142" fill="#d1fae5" font-size="13" font-weight="600" text-anchor="middle">kubelet agent</text>

  <rect x="600" y="115" width="145" height="45" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1.5" />
  <text x="672" y="142" fill="#d1fae5" font-size="13" font-weight="600" text-anchor="middle">kube-proxy</text>

  <rect x="440" y="175" width="305" height="135" rx="8" fill="#064e3b" stroke="#059669" stroke-width="1.5" />
  <text x="592" y="195" fill="#6ee7b7" font-size="12" font-weight="700" text-anchor="middle">Container Runtime (containerd / Docker)</text>

  <!-- Pods inside Runtime -->
  <rect x="455" y="210" width="130" height="85" rx="6" fill="#022c22" stroke="#10b981" />
  <text x="520" y="232" fill="#34d399" font-size="12" font-weight="700" text-anchor="middle">📦 Pod A</text>
  <rect x="465" y="242" width="110" height="40" rx="4" fill="#064e3b" />
  <text x="520" y="266" fill="#a7f3d0" font-size="11" text-anchor="middle">App Container</text>

  <rect x="600" y="210" width="130" height="85" rx="6" fill="#022c22" stroke="#10b981" />
  <text x="665" y="232" fill="#34d399" font-size="12" font-weight="700" text-anchor="middle">📦 Pod B</text>
  <rect x="610" y="242" width="110" height="40" rx="4" fill="#064e3b" />
  <text x="665" y="266" fill="#a7f3d0" font-size="11" text-anchor="middle">App + Sidecar</text>
</svg>
