<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="100%" height="100%" style="background-color: #0f172a; border-radius: 12px; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <text x="400" y="32" fill="#38bdf8" font-size="18" font-weight="700" text-anchor="middle">Pod Lifecycle, Init Containers &amp; Health Probes</text>

  <!-- Timeline Background -->
  <rect x="30" y="60" width="740" height="255" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />

  <!-- Stage 1: Scheduled / Pending -->
  <rect x="45" y="80" width="160" height="75" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
  <text x="125" y="102" fill="#a5b4fc" font-size="12" font-weight="700" text-anchor="middle">1. Pending Stage</text>
  <text x="125" y="122" fill="#cbd5e1" font-size="11" text-anchor="middle">• Image pull</text>
  <text x="125" y="140" fill="#cbd5e1" font-size="11" text-anchor="middle">• Node binding</text>

  <path d="M 205 117 L 235 117" stroke="#6366f1" stroke-width="2" />
  <polygon points="233,111 243,117 233,123" fill="#6366f1" />

  <!-- Stage 2: Init Containers -->
  <rect x="245" y="80" width="180" height="75" rx="8" fill="#312e81" stroke="#818cf8" stroke-width="1.5" />
  <text x="335" y="102" fill="#c7d2fe" font-size="12" font-weight="700" text-anchor="middle">2. initContainers</text>
  <text x="335" y="122" fill="#e0e7ff" font-size="11" text-anchor="middle">• Run sequentially</text>
  <text x="335" y="140" fill="#e0e7ff" font-size="11" text-anchor="middle">• Must exit 0 to proceed</text>

  <path d="M 425 117 L 455 117" stroke="#818cf8" stroke-width="2" />
  <polygon points="453,111 463,117 453,123" fill="#818cf8" />

  <!-- Stage 3: Main App Container Running -->
  <rect x="465" y="80" width="285" height="75" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
  <text x="607" y="102" fill="#6ee7b7" font-size="12" font-weight="700" text-anchor="middle">3. Main Container Running</text>
  <text x="607" y="122" fill="#d1fae5" font-size="11" text-anchor="middle">• App process executing</text>
  <text x="607" y="140" fill="#d1fae5" font-size="11" text-anchor="middle">• Active Probe Monitoring</text>

  <!-- Bottom Section: Probes -->
  <rect x="45" y="175" width="705" height="125" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-dasharray="4 4" />
  <text x="397" y="197" fill="#38bdf8" font-size="13" font-weight="700" text-anchor="middle">🔎 Container Health Probes (Liveness, Readiness, Startup)</text>

  <rect x="60" y="212" width="215" height="75" rx="6" fill="#1e293b" stroke="#f59e0b" />
  <text x="167" y="232" fill="#fcd34d" font-size="12" font-weight="700" text-anchor="middle">🚦 startupProbe</text>
  <text x="167" y="252" fill="#cbd5e1" font-size="10" text-anchor="middle">Disables other probes until app starts.</text>
  <text x="167" y="270" fill="#94a3b8" font-size="10" text-anchor="middle">Prevents slow app boot kills.</text>

  <rect x="290" y="212" width="215" height="75" rx="6" fill="#1e293b" stroke="#10b981" />
  <text x="397" y="232" fill="#6ee7b7" font-size="12" font-weight="700" text-anchor="middle">🌐 readinessProbe</text>
  <text x="397" y="252" fill="#cbd5e1" font-size="10" text-anchor="middle">Controls traffic routing.</text>
  <text x="397" y="270" fill="#94a3b8" font-size="10" text-anchor="middle">Fails = Removed from Service Endpoints.</text>

  <rect x="520" y="212" width="215" height="75" rx="6" fill="#1e293b" stroke="#ef4444" />
  <text x="627" y="232" fill="#fca5a5" font-size="12" font-weight="700" text-anchor="middle">🔄 livenessProbe</text>
  <text x="627" y="252" fill="#cbd5e1" font-size="10" text-anchor="middle">Detects deadlocks/crashes.</text>
  <text x="627" y="270" fill="#94a3b8" font-size="10" text-anchor="middle">Fails = Kubelet restarts container.</text>
</svg>
