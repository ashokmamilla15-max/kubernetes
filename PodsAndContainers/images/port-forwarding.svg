<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="100%" style="background-color: #0f172a; border-radius: 12px; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <text x="400" y="32" fill="#38bdf8" font-size="18" font-weight="700" text-anchor="middle">Kubernetes Port Forwarding Architecture</text>

  <!-- Step 1: Local Machine -->
  <rect x="30" y="70" width="200" height="210" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
  <rect x="40" y="80" width="180" height="28" rx="5" fill="#0284c7" />
  <text x="130" y="99" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">💻 Local Machine</text>
  <text x="45" y="130" fill="#94a3b8" font-size="11" font-weight="600">Developer Workstation</text>
  <rect x="45" y="145" width="170" height="40" rx="6" fill="#0f172a" stroke="#38bdf8" />
  <text x="130" y="163" fill="#e0f2fe" font-size="11" font-weight="600" text-anchor="middle">Browser / Curl</text>
  <text x="130" y="177" fill="#38bdf8" font-size="10" text-anchor="middle">http://localhost:8080</text>
  <rect x="45" y="195" width="170" height="40" rx="6" fill="#0f172a" stroke="#6366f1" />
  <text x="130" y="213" fill="#a5b4fc" font-size="11" font-weight="600" text-anchor="middle">kubectl CLI</text>
  <text x="130" y="227" fill="#cbd5e1" font-size="10" text-anchor="middle">listens on local 8080</text>

  <!-- Arrow 1 -->
  <path d="M 230 165 L 290 165" stroke="#38bdf8" stroke-width="2.5" />
  <polygon points="288,159 298,165 288,171" fill="#38bdf8" />
  <text x="264" y="155" fill="#7dd3fc" font-size="10" text-anchor="middle">TCP Tunnel</text>

  <!-- Step 2: K8s API Server -->
  <rect x="300" y="70" width="200" height="210" rx="12" fill="#1e1b4b" stroke="#818cf8" stroke-width="2" />
  <rect x="310" y="80" width="180" height="28" rx="5" fill="#4338ca" />
  <text x="400" y="99" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">👑 K8s API Server</text>
  <text x="315" y="130" fill="#a5b4fc" font-size="11" font-weight="600">Control Plane Endpoint</text>
  <rect x="315" y="150" width="170" height="110" rx="6" fill="#0f172a" stroke="#6366f1" />
  <text x="400" y="175" fill="#e0e7ff" font-size="11" font-weight="600" text-anchor="middle">SPDY / HTTP2 Stream</text>
  <text x="400" y="198" fill="#94a3b8" font-size="10" text-anchor="middle">• Authenticates request</text>
  <text x="400" y="218" fill="#94a3b8" font-size="10" text-anchor="middle">• Streams raw traffic</text>
  <text x="400" y="238" fill="#94a3b8" font-size="10" text-anchor="middle">between local &amp; pod</text>

  <!-- Arrow 2 -->
  <path d="M 500 165 L 560 165" stroke="#10b981" stroke-width="2.5" />
  <polygon points="558,159 568,165 558,171" fill="#10b981" />
  <text x="530" y="155" fill="#6ee7b7" font-size="10" text-anchor="middle">Pod Stream</text>

  <!-- Step 3: Target Pod -->
  <rect x="570" y="70" width="200" height="210" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="2" />
  <rect x="580" y="80" width="180" height="28" rx="5" fill="#047857" />
  <text x="670" y="99" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">📦 Target Pod</text>
  <text x="585" y="130" fill="#a7f3d0" font-size="11" font-weight="600">Container Runtime</text>
  <rect x="585" y="150" width="170" height="110" rx="6" fill="#022c22" stroke="#34d399" />
  <text x="670" y="175" fill="#d1fae5" font-size="11" font-weight="600" text-anchor="middle">Container Port 80</text>
  <text x="670" y="198" fill="#a7f3d0" font-size="10" text-anchor="middle">• Receives forwarded</text>
  <text x="670" y="213" fill="#a7f3d0" font-size="10" text-anchor="middle">  HTTP requests</text>
  <text x="670" y="235" fill="#a7f3d0" font-size="10" text-anchor="middle">• Processes &amp; responds</text>
</svg>
