<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="100%" style="background-color: #0f172a; border-radius: 12px; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <text x="400" y="32" fill="#38bdf8" font-size="18" font-weight="700" text-anchor="middle">Kubernetes Pod Abstraction Layer</text>

  <!-- Outer Pod Container -->
  <rect x="40" y="55" width="720" height="220" rx="16" fill="#1e293b" stroke="#0ea5e9" stroke-width="2.5" filter="url(#shadow2)" />
  <rect x="60" y="68" width="220" height="32" rx="8" fill="#0284c7" />
  <text x="170" y="89" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">☸️ Kubernetes Pod Context</text>

  <!-- Shared Network Box -->
  <rect x="70" y="115" width="260" height="140" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-dasharray="4 4" />
  <text x="200" y="140" fill="#7dd3fc" font-size="13" font-weight="700" text-anchor="middle">🌐 Shared Network Space</text>
  <text x="200" y="165" fill="#94a3b8" font-size="12" text-anchor="middle">• Unique Pod IP Address</text>
  <text x="200" y="188" fill="#94a3b8" font-size="12" text-anchor="middle">• Shared Port Range</text>
  <text x="200" y="211" fill="#94a3b8" font-size="12" text-anchor="middle">• Inter-container localhost</text>

  <!-- Shared Volume Box -->
  <rect x="345" y="115" width="130" height="140" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-dasharray="4 4" />
  <text x="410" y="140" fill="#fcd34d" font-size="13" font-weight="700" text-anchor="middle">💾 Volumes</text>
  <text x="410" y="175" fill="#94a3b8" font-size="11" text-anchor="middle">Shared Persistent</text>
  <text x="410" y="195" fill="#94a3b8" font-size="11" text-anchor="middle">or Ephemeral</text>
  <text x="410" y="215" fill="#94a3b8" font-size="11" text-anchor="middle">Storage</text>

  <!-- Containers Area -->
  <rect x="490" y="115" width="250" height="140" rx="10" fill="#022c22" stroke="#10b981" stroke-width="1.5" />
  <text x="615" y="138" fill="#34d399" font-size="13" font-weight="700" text-anchor="middle">📦 Isolated Containers</text>

  <rect x="505" y="152" width="105" height="85" rx="8" fill="#065f46" stroke="#34d399" />
  <text x="557" y="185" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">App</text>
  <text x="557" y="205" fill="#a7f3d0" font-size="10" text-anchor="middle">Container</text>

  <rect x="620" y="152" width="105" height="85" rx="8" fill="#047857" stroke="#34d399" />
  <text x="672" y="185" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">Sidecar</text>
  <text x="672" y="205" fill="#a7f3d0" font-size="10" text-anchor="middle">Container</text>
</svg>
