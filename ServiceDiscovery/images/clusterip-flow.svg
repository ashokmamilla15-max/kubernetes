<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" width="100%" height="100%" style="background-color: #0f172a; border-radius: 12px; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="shadow-clusterip" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Title -->
  <text x="410" y="32" fill="#38bdf8" font-size="18" font-weight="700" text-anchor="middle">Kubernetes ClusterIP Service Flow (Internal Pod-to-Pod)</text>

  <!-- Step 1: Calling Portal Pod -->
  <g transform="translate(25, 70)">
    <rect x="0" y="0" width="220" height="210" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="2" filter="url(#shadow-clusterip)" />
    <rect x="10" y="10" width="200" height="28" rx="6" fill="#047857" />
    <text x="110" y="29" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">📦 Portal Pod (Frontend)</text>
    <text x="110" y="60" fill="#6ee7b7" font-size="11" text-anchor="middle">grade-submission-portal</text>

    <rect x="12" y="75" width="196" height="55" rx="6" fill="#022c22" stroke="#34d399" />
    <text x="110" y="93" fill="#a7f3d0" font-size="10" font-weight="700" text-anchor="middle">Environment Variable:</text>
    <text x="110" y="110" fill="#ffffff" font-size="10" font-family="monospace" text-anchor="middle">API_URL=http://api-service:3000</text>

    <rect x="12" y="140" width="196" height="55" rx="6" fill="#047857" />
    <text x="110" y="160" fill="#e0f2fe" font-size="11" font-weight="600" text-anchor="middle">Internal Request</text>
    <text x="110" y="178" fill="#d1fae5" font-size="10" text-anchor="middle">via Service Name &amp; Port</text>
  </g>

  <!-- Arrow 1: Portal Pod to ClusterIP Service -->
  <path d="M 245 175 L 290 175" stroke="#34d399" stroke-width="2.5" />
  <polygon points="288,169 298,175 288,181" fill="#34d399" />

  <!-- Step 2: ClusterIP Service -->
  <g transform="translate(300, 70)">
    <rect x="0" y="0" width="230" height="210" rx="12" fill="#1e1b4b" stroke="#6366f1" stroke-width="2" filter="url(#shadow-clusterip)" />
    <rect x="10" y="10" width="210" height="28" rx="6" fill="#4338ca" />
    <text x="115" y="29" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">🔒 ClusterIP Service</text>
    <text x="115" y="60" fill="#c7d2fe" font-size="11" font-weight="600" text-anchor="middle">grade-submission-api-service</text>

    <rect x="15" y="75" width="200" height="60" rx="6" fill="#0f172a" stroke="#818cf8" />
    <text x="115" y="95" fill="#a5b4fc" font-size="11" text-anchor="middle">Internal DNS: <tspan fill="#ffffff" font-weight="600">api-service</tspan></text>
    <text x="115" y="112" fill="#a5b4fc" font-size="11" text-anchor="middle">Service Port: <tspan fill="#ffffff" font-weight="700">3000</tspan></text>

    <rect x="15" y="145" width="200" height="50" rx="6" fill="#312e81" />
    <text x="115" y="165" fill="#fcd34d" font-size="10" font-weight="700" text-anchor="middle">Label Selector:</text>
    <text x="115" y="180" fill="#fef08a" font-size="10" text-anchor="middle">component=backend</text>
  </g>

  <!-- Arrow 2: Selector Arrow to API Pod -->
  <g>
    <path d="M 530 175 L 575 175" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="5 4" />
    <polygon points="573,169 583,175 573,181" fill="#f59e0b" />
    <text x="552" y="162" fill="#fcd34d" font-size="10" font-weight="700" text-anchor="middle">Selector</text>
  </g>

  <!-- Step 3: Target API Pod -->
  <g transform="translate(585, 70)">
    <rect x="0" y="0" width="210" height="210" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2" filter="url(#shadow-clusterip)" />
    <rect x="10" y="10" width="190" height="28" rx="6" fill="#0284c7" />
    <text x="100" y="29" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">📦 Target API Pod</text>
    <text x="100" y="60" fill="#7dd3fc" font-size="11" font-weight="600" text-anchor="middle">grade-submission-api</text>

    <rect x="12" y="75" width="186" height="40" rx="6" fill="#0f172a" stroke="#38bdf8" />
    <text x="100" y="99" fill="#e0f2fe" font-size="11" text-anchor="middle">Labels: <tspan fill="#ffffff">component=backend</tspan></text>

    <!-- Downward Arrow to Target Port -->
    <path d="M 100 120 L 100 140" stroke="#38bdf8" stroke-width="2" />
    <polygon points="94,138 100,146 106,138" fill="#38bdf8" />

    <rect x="12" y="148" width="186" height="48" rx="6" fill="#0284c7" stroke="#38bdf8" />
    <text x="100" y="168" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">Target Port: 3000</text>
    <text x="100" y="184" fill="#e0f2fe" font-size="10" text-anchor="middle">API Container Listens</text>
  </g>
</svg>
